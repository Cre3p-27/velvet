# ─────────────────────────────────────────────────────────────────────────────
#  VELVET · Hyprland integration
#
#  Add this ONE line to the bottom of your ~/.config/hypr/hyprland.conf:
#
#      source = ~/.config/hypr/velvet-shell.conf
#
#  (install.sh does that for you.)
#
#  This file holds the bits Velvet needs but does not manage: keybinds, layer
#  rules and autostart. The values you change inside Super+Tab — gaps, blur,
#  rounding, shadows — are written to a SEPARATE file, ~/.config/hypr/velvet.conf,
#  which is sourced at the end so it always wins.
# ─────────────────────────────────────────────────────────────────────────────


# ══ AUTOSTART ════════════════════════════════════════════════════════════════
exec-once = qs -c velvet -d


# ══ KEYBINDS ═════════════════════════════════════════════════════════════════
# Quickshell registers these as global shortcuts, so they work even when a
# fullscreen client is grabbing the keyboard.

bind = SUPER, Tab,    global, quickshell:settings        # the Persona menu
bind = SUPER, Space,  global, quickshell:launcher        # app launcher
bind = SUPER, N,      global, quickshell:notifications   # notification centre
bind = SUPER, Escape, global, quickshell:session         # power menu
bind = SUPER SHIFT, F, global, quickshell:focus          # focus mode on / off
bind = SUPER, W, global, quickshell:wheel                # wallpaper wheel
bind = SUPER, M, global, quickshell:windowMap      # the mini desktop
bind = SUPER SHIFT, S, global, quickshell:scene          # open the desktop you arranged
bind = SUPER SHIFT, L, global, quickshell:lyrics         # lyrics
bind = SUPER SHIFT, K, global, quickshell:keys           # every shortcut, on one screen

# If a global shortcut ever fails to register (older Hyprland, or the portal is
# not running), swap the line above for the IPC equivalent — same result:
#
#   bind = SUPER, Tab, exec, qs -c velvet ipc call panels settings


# ══ MEDIA / HARDWARE KEYS ════════════════════════════════════════════════════
# Velvet's OSD reacts to whatever changes the volume, so wpctl is enough.

bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -q s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q s 5%-

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous


# ══ LAYER RULES ══════════════════════════════════════════════════════════════
# Not here on purpose: the shell registers its own layer rules over hyprctl at
# startup (blur behind the bar, popouts, notifications, OSD). That way they
# work identically on a Lua config and there is nothing to keep in sync.


# ══ MANAGED DESIGN ═══════════════════════════════════════════════════════════
# Everything below this line is written by Velvet whenever you move a slider in
# Super+Tab → WINDOWS. Sourcing it last means the menu always wins. Do not edit
# velvet.conf by hand — it gets overwritten.

source = ~/.config/hypr/velvet.conf
