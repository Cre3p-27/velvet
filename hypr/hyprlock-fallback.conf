# VELVET · the stand-in lock. velvet-session starts hyprlock with this when
# Velvet's own lock did not come up at boot and you have no hyprlock.conf.
general {
    hide_cursor = false
}

background {
    monitor =
    color = rgba(17, 13, 16, 1.0)
}

label {
    monitor =
    text = VELVET'S LOCK DID NOT START · HYPRLOCK STANDS IN
    color = rgba(230, 30, 70, 1.0)
    font_size = 16
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 56
    outline_thickness = 2
    outer_color = rgba(230, 30, 70, 1.0)
    inner_color = rgba(30, 24, 28, 1.0)
    font_color = rgba(240, 236, 238, 1.0)
    placeholder_text = Password
    fade_on_empty = false
    position = 0, -10
    halign = center
    valign = center
}
