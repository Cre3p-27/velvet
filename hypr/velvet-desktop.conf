# ─────────────────────────────────────────────────────────────────────────────
#  VELVET · the infinite desktop, the zoom and the window tools (hyprland.conf)
#  Sourced by install.sh only when your own config does not already bind these.
#  Keys: see velvet-desktop.lua (Super+Z/X desktops, Super+D float/tile,
#  Super+Shift/Ctrl/Alt+arrows, Super+Alt+wheel zoom, Super+Alt+left click
#  1:1, Super+Alt+right click: every window on screen).
# ─────────────────────────────────────────────────────────────────────────────
$velvet = ~/.config/quickshell/velvet

exec-once = python3 $velvet/scripts/infinite_desktop_core.py 1.6 > /tmp/velvet-infinite-desktop.log 2>&1

bind = SUPER, Z, workspace, -1
bind = SUPER, X, workspace, +1
bind = SUPER SHIFT, Z, movetoworkspace, -1
bind = SUPER SHIFT, X, movetoworkspace, +1
bind = SUPER, D, exec, python3 $velvet/scripts/floating_tile_toggle.py

binde = SUPER SHIFT, left,  exec, python3 $velvet/scripts/move_window.py left
binde = SUPER SHIFT, right, exec, python3 $velvet/scripts/move_window.py right
binde = SUPER SHIFT, up,    exec, python3 $velvet/scripts/move_window.py up
binde = SUPER SHIFT, down,  exec, python3 $velvet/scripts/move_window.py down
bind = SUPER CTRL, left,  exec, python3 $velvet/scripts/navigate_windows.py left
bind = SUPER CTRL, right, exec, python3 $velvet/scripts/navigate_windows.py right
bind = SUPER CTRL, up,    exec, python3 $velvet/scripts/navigate_windows.py up
bind = SUPER CTRL, down,  exec, python3 $velvet/scripts/navigate_windows.py down
bind = SUPER ALT, left,  exec, python3 $velvet/scripts/move_window_tiled.py left
bind = SUPER ALT, right, exec, python3 $velvet/scripts/move_window_tiled.py right
bind = SUPER ALT, up,    exec, python3 $velvet/scripts/move_window_tiled.py up
bind = SUPER ALT, down,  exec, python3 $velvet/scripts/move_window_tiled.py down

bind = SUPER ALT, mouse_up,   exec, python3 $velvet/scripts/desktop_zoom.py in
bind = SUPER ALT, mouse_down, exec, python3 $velvet/scripts/desktop_zoom.py out
bind = SUPER ALT, mouse:274,  exec, python3 $velvet/scripts/desktop_zoom.py reset
bind = SUPER ALT, mouse:272,  exec, python3 $velvet/scripts/desktop_zoom.py reset
bind = SUPER ALT, mouse:273,  exec, python3 $velvet/scripts/desktop_zoom.py fit
